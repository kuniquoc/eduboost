model:
  base_model: "unsloth/Qwen2.5-7B-Instruct"
  max_seq_length: 2048
  load_in_4bit: true
  lora_r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

training:
  data_file: "data/processed/quiz_chat.jsonl"
  output_dir: "models/adapters/quiz_v1"
  checkpoint_dir: "outputs/checkpoints/quiz"
  epochs: 3
  batch_size: 2
  grad_accum: 4
  learning_rate: 0.0002
  val_split: 0.2
  logging_steps: 1
  eval_steps: 10
  save_steps: 10
  save_total_limit: 2
  early_stopping_patience: 3
  early_stopping_threshold: 0.01

system_prompt: "You are an expert English Assessment Designer for Vietnamese students learning English. You create high-quality MCQ questions with exactly ONE correct answer. The explanation must be in Vietnamese. Output valid JSON only — no extra text."