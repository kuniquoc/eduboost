services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: eduboost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eduboost
      POSTGRES_USER: eduboost
      POSTGRES_PASSWORD: eduboost_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduboost -d eduboost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── MinIO (S3-compatible object storage) ───────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: eduboost-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console UI
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── EduBoost API Server ─────────────────────────────────────────────────────
  server:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: eduboost-server
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # PostgreSQL
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=eduboost;Username=eduboost;Password=eduboost_pass;Include Error Detail=true"
      # JWT (CHANGE IN PRODUCTION!)
      Jwt__Secret: "eduboost-super-secret-jwt-key-change-in-production-2024!"
      Jwt__Issuer: "EduBoost"
      Jwt__Audience: "EduBoost"
      Jwt__AccessTokenExpiryMinutes: "60"
      Jwt__RefreshTokenExpiryDays: "30"
      # MinIO
      MinIO__Endpoint: "minio:9000"
      MinIO__AccessKey: "minioadmin"
      MinIO__SecretKey: "minioadmin123"
      MinIO__UseSSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pgdata:
    name: eduboost_pgdata
  miniodata:
    name: eduboost_miniodata
