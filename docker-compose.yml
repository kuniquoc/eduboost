services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: eduboost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eduboost
      POSTGRES_USER: eduboost
      POSTGRES_PASSWORD: eduboost_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U eduboost -d eduboost" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── MinIO (S3-compatible object storage) ───────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: eduboost-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console UI
    volumes:
      - miniodata:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── EduBoost AI Agent (Python FastAPI) ──────────────────────────────────────
  ai-agent:
    build:
      context: ./ai-agent-core
      dockerfile: Dockerfile
    container_name: eduboost-ai-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QUIZ_LLM_ENDPOINT: ${QUIZ_LLM_ENDPOINT:-}
      QUIZ_LLM_MODEL: ${QUIZ_LLM_MODEL:-}
      EXPLAIN_LLM_ENDPOINT: ${EXPLAIN_LLM_ENDPOINT:-}
      EXPLAIN_LLM_MODEL: ${EXPLAIN_LLM_MODEL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
      QUIZ_BATCH_MAX_CONCURRENT: ${QUIZ_BATCH_MAX_CONCURRENT:-1}
    volumes:
      - faissdata:/app/models/vector_db
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  # ── EduBoost API Server ─────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: eduboost-server
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # PostgreSQL
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=eduboost;Username=eduboost;Password=eduboost_pass;Include Error Detail=true"
      # JWT (CHANGE IN PRODUCTION!)
      Jwt__Secret: ${JWT_SECRET:-}
      Jwt__Issuer: "EduBoost"
      Jwt__Audience: "EduBoost"
      Jwt__AccessTokenExpiryMinutes: "60"
      Jwt__RefreshTokenExpiryDays: "30"
      # MinIO
      MinIO__Endpoint: "minio:9000"
      MinIO__AgentEndpoint: "minio:9000"
      MinIO__PublicEndpoint: "localhost:9000"
      MinIO__AccessKey: "minioadmin"
      MinIO__SecretKey: "minioadmin123"
      MinIO__UseSSL: "false"
      MinIO__PublicUseSSL: "false"
      # AI Agent
      AIAgent__BaseUrl: "http://ai-agent:8000"
      # Seed admin (override via .env: SEED_ADMIN_EMAIL, SEED_ADMIN_PASSWORD)
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-admin@eduboost.local}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:-admin123}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-agent:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  faissdata:
